  - story: changes-for-lesson-4
  - run: git rm --cached debug.log
  - run: git add .gitignore
  - run: 'git commit -m "chore: stop tracking debug.log"'
  - run: git add app.py dates.py
  - run: 'git commit -m "feat: add due dates"'
  - run: git add README.md
  - run: 'git commit -m "docs: add a README"'

