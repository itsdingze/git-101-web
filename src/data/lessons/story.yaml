# The todo-app story.
#
# Each checkpoint is the state of the project at the end of one lesson, as a
# list of seed steps. A sandbox starts from a checkpoint with a `story:` step,
# and a checkpoint builds on the one before it the same way. `changes-for-`
# checkpoints are the uncommitted edits a lesson's practice starts with.
#
# Until "Put your project on GitHub", every lesson happens in the folder where the project
# started. From then on, the project also lives on GitHub, and the `team-`
# checkpoints are the state of that shared copy.

home-files:
  - write:
      ~/documents/letter.txt: |
        Dear Sam,
      ~/projects/recipes/soup.txt: |
        Tomato soup

project-files:
  - write:
      app.py: |
        def load_tasks() -> None:
            # Read tasks from tasks.txt.
            pass
        
        def show_tasks() -> None:
            # Show all tasks.
            pass
      tasks.txt: |
        Buy milk
        Call the dentist
      debug.log: |
        app started

after-start-a-project:
  - story: project-files
  - run: git init

after-first-commit:
  - story: after-start-a-project
  - write:
      .gitignore: |
        tasks.txt
  - run: git add .
  - run: 'git commit -m "feat: add task list"'

